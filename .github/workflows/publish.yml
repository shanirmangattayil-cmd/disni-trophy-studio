name: Publish signed APK
on:
  push:
    branches: [main]
    paths: ['release/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(cat release/version.txt)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest release/Disni-Trophies.apk --title "Disni Trophies v$V" --notes "Tap Disni-Trophies.apk to download, then open it to install."
